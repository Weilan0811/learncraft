[project]
name = "content-generator-agent"
version = "0.1.0"
description = "Content generation agent skeleton for multimodal learning content."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "bleach>=6.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "imageio-ffmpeg>=0.8.1",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "langchain-qdrant>=1.1.0",
    "langgraph>=0.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pymysql>=1.1.2",
    "qdrant-client>=1.16.0",
    "reportlab>=5.1.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
kb-local = ["torch>=2.2", "FlagEmbedding>=1.3.5"]

[dependency-groups]
dev = [
    "pypdf>=7.0.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
